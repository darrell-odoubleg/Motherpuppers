plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing comes from keystore.properties (kept out of git). Without it, release builds are unsigned.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystoreProps.load(new FileInputStream(keystorePropsFile))

android {
    namespace 'com.motherpuppers.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.motherpuppers.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'BASE_URL', '"https://app.motherpuppers.net/"'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
